<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ABB INVESTIMENTOS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --gradiente: linear-gradient(135deg,#4a3aff,#8a2cff);
  --fundo:#eef1f8;
  --card:#ffffff;
  --texto:#222;
  --muted:#6b6d7b;
  --radius:18px;
  --sombra:0 10px 30px rgba(0,0,0,0.06);
  --sombra2:0 4px 12px rgba(0,0,0,0.05);
  font-family:"Poppins", sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--fundo);
  color:var(--texto);
  display:flex;
  justify-content:center;
  padding:22px;
  min-height:100vh;
}

.wrap{
  width:100%;
  max-width:1000px;
}

header{
  text-align:center;
  margin-bottom:25px;
}

header h1{
  font-size:1.8rem;
  font-weight:700;
  background:var(--gradiente);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.grid-cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
  margin-bottom:28px;
}

.card-info{
  background:var(--card);
  padding:16px;
  border-radius:var(--radius);
  box-shadow:var(--sombra2);
  position:relative;
  overflow:hidden;
}

.card-info:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:6px;
  background:var(--gradiente);
}

.card-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon-circle{
  width:48px;
  height:48px;
  background:var(--gradiente);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:20px;
}

.card-label{font-size:0.85rem;color:var(--muted)}
.card-value{
  font-size:1.5rem;
  font-weight:700;
  margin-top:4px;
  background:var(--gradiente);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.box-link{
  background:var(--card);
  padding:20px;
  border-radius:var(--radius);
  box-shadow:var(--sombra2);
  margin-bottom:25px;
}

.box-link h2{
  font-size:1.1rem;
  margin-bottom:12px;
  color:#4035ce;
}

.link-row{display:flex;gap:10px}

.link-show{
  flex:1;
  background:#eef0ff;
  padding:12px;
  border-radius:var(--radius);
  border:1px solid #d7d9ff;
  font-size:0.85rem;
  word-break:break-all;
}

.btn-copy{
  background:var(--gradiente);
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:var(--radius);
  font-weight:600;
  cursor:pointer;
}

.section{
  background:var(--card);
  padding:20px;
  border-radius:var(--radius);
  box-shadow:var(--sombra2);
  margin-bottom:20px;
}

.section h3{
  font-size:1rem;
  margin-bottom:12px;
  background:var(--gradiente);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{background:#4d3bff;color:#fff}
th,td{padding:12px;text-align:left}
td{border-bottom:1px solid #eee}
tr:nth-child(even){background:#fafafa}

@media(max-width:600px){
  header h1{font-size:1.35rem}
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h1><i class="fa-solid fa-handshake"></i> Painel de Parceiros</h1>
</header>

<div class="grid-cards">

  <div class="card-info">
    <div class="card-top">
      <div class="icon-circle"><i class="fa-solid fa-wallet"></i></div>
      <div>
        <div class="card-label">Saldo Principal</div>
        <div class="card-value" id="saldoPrincipal">0</div>
      </div>
    </div>
  </div>

  <div class="card-info">
    <div class="card-top">
      <div class="icon-circle"><i class="fa-solid fa-gift"></i></div>
      <div>
        <div class="card-label">Saldo de Bônus</div>
        <div class="card-value" id="saldoBonus">0</div>
      </div>
    </div>
  </div>

  <div class="card-info">
    <div class="card-top">
      <div class="icon-circle"><i class="fa-solid fa-circle-check"></i></div>
      <div>
        <div class="card-label">Ganhos creditados</div>
        <div class="card-value" id="comissaoTotal">0</div>
      </div>
    </div>
  </div>

  <div class="card-info">
    <div class="card-top">
      <div class="icon-circle"><i class="fa-solid fa-plus"></i></div>
      <div>
        <div class="card-label">Novos ganhos</div>
        <div class="card-value" id="novasComissoes">0</div>
      </div>
    </div>
  </div>

</div>

<!-- LINK -->
<div class="box-link">
  <h2><i class="fa-solid fa-link"></i> Seu link de convite</h2>
  <div class="link-row">
    <div id="linkConvite" class="link-show">A carregar...</div>
    <button id="btnCopiar" class="btn-copy"><i class="fa-solid fa-copy"></i></button>
  </div>
</div>

<!-- TABELAS -->
<div class="section">
  <h3>Nível 1 (30%)</h3>
  <table id="tab1"><tbody></tbody></table>
</div>

<div class="section">
  <h3>Nível 2 (7%)</h3>
  <table id="tab2"><tbody></tbody></table>
</div>

<div class="section">
  <h3>Nível 3 (3%)</h3>
  <table id="tab3"><tbody></tbody></table>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCpK1eBlNJtmSylWsaNt3-m9z9hMgoqxf4",
  authDomain: "milionariopalpites.firebaseapp.com",
  databaseURL: "https://milionariopalpites-default-rtdb.firebaseio.com",
  projectId: "milionariopalpites",
  storageBucket: "milionariopalpites.appspot.com",
  messagingSenderId: "702099362398",
  appId: "1:702099362398:android:2050ef61e5b4efedbe9acf"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

auth.onAuthStateChanged(async user => {
  if (!user) return (window.location.href="index.html");

  const uid = user.uid;
  const snap = await db.ref("usuarios/"+uid).once("value");
  const me = snap.val() || {};

  const codigo = me.codigoConviteCurto || uid.substring(0,6);

  // ✅ FIX DO LINK (AQUI ESTAVA O ERRO)
  const link = "https://abb-investimentos.github.io/o/registrar.html?ref=" + codigo;

  document.getElementById("linkConvite").textContent = link;

  document.getElementById("saldoPrincipal").textContent = (me.saldo||0).toFixed(2);
  document.getElementById("saldoBonus").textContent = (me.saldo2||0).toFixed(2);
});

document.getElementById("btnCopiar").addEventListener("click", () => {
  const txt = document.getElementById("linkConvite").textContent;
  navigator.clipboard.writeText(txt);
  alert("Link copiado!");
});
</script>

</body>
</html>
